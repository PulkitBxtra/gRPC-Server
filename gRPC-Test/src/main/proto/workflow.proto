syntax = "proto3";

option java_outer_classname="workflow";
option java_multiple_files=true;
option java_package="com.bxtra.grpctest.grpc";

message workflowRequest{
  string workflowId=1;
  string executionId=2;
}

message workflowResponse{
  string workflowId=1;
  string executionId=2;
  int64 startTime=3;
  int64 endTime=4;
}

service WorkflowService{
  rpc Workflow(workflowRequest) returns (workflowResponse);
}